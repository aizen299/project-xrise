services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: |
        mongosh --quiet --eval '
          try { rs.status().ok }
          catch (e) { rs.initiate({_id:"rs0",members:[{_id:0,host:"mongo:27017"}]}).ok }
        '
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  app:
    build: .
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      MONGODB_URI: mongodb://mongo:27017/xrise-helpdesk?replicaSet=rs0&directConnection=true
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env or the environment}
      APP_ORIGIN: http://localhost:3000
      NODE_ENV: production
      LOG_LEVEL: info
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      LLM_API_KEY: ${LLM_API_KEY:-}

volumes:
  mongo-data:
